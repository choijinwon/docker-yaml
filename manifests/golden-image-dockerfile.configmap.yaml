apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-image-dockerfile
data:
  Dockerfile: |
    ARG BASE_IMAGE=harbor.local/nvidia/cuda:12.8.0-cudnn-devel-ubuntu22.04
    FROM ${BASE_IMAGE}

    ARG PYTHON_VERSION=3.11.9

    ENV PIP_NO_INDEX=true
    ENV PIP_FIND_LINKS=/opt/wheelhouse
    ENV ACCELERATOR=cuda
    ENV GPU_MODEL=b300
    ENV GPU_ARCHITECTURE=blackwell
    ENV CUDA_VERSION=12.8
    ENV MINIMUM_NVIDIA_DRIVER_VERSION=570.26
    ENV NVIDIA_VISIBLE_DEVICES=all
    ENV NVIDIA_DRIVER_CAPABILITIES=compute,utility

    COPY ca/internal-ca.crt /usr/local/share/ca-certificates/internal-ca.crt
    RUN update-ca-certificates || true

    RUN python3 --version && python3 -m pip --version && nvidia-smi || true
