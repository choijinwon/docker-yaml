apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: user-image-build
  namespace: argo
  labels:
    workflows.argoproj.io/creator: system-serviceaccount-argo-argo-server
    app.kubernetes.io/name: admin
    app.kubernetes.io/part-of: image-build-standard
    image-build.openai/type: user
spec:
  entrypoint: main
  serviceAccountName: argo-kserver
  parallelism: 4
  arguments:
    parameters:
      - name: image-type
        value: user
      - name: user-id
        value: ""
      - name: bitbucket-address-user-code
        value: ssh://git@bitbucket.CHANGE_ME/project/sample-app.git
      - name: git-revision
        value: main
      - name: context-path
        value: "."
      - name: requirements-lock-path
        value: requirements.lock
      - name: golden-image-uuid
        value: ""
      - name: nexus-pypi-url
        value: https://nexus.CHANGE_ME.internal/repository/pypi-group/simple
      - name: registry-address
        value: harbor.CHANGE_ME.internal
      - name: registry-project
        value: applications
      - name: cache-registry-address
        value: harbor.CHANGE_ME.internal/build-cache
      - name: buildkit-address
        value: tcp://buildkitd.buildkit.svc.cluster.local:1234
      - name: image-tag
        value: 20260728-001
      - name: image-name
        value: ""
      - name: shell-type
        value: bash
      - name: entrypoint-type
        value: module
      - name: entrypoint-value
        value: src.api
      - name: entrypoint-args
        value: ""
      - name: working-directory
        value: /app
      - name: run-as-user
        value: "10001"
      - name: environment-profile
        value: production
      - name: notification-server-url
        value: ""

  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes:
          - ReadWriteMany
        storageClassName: CHANGE_ME-rwx-storage
        resources:
          requests:
            storage: 20Gi

  volumes:
    - name: registry-auth
      secret:
        secretName: harbor-registry-auth
        items:
          - key: .dockerconfigjson
            path: config.json
    - name: bitbucket-ssh
      secret:
        secretName: bitbucket-ssh-key
        defaultMode: 0400
    - name: golden-image-catalog
      configMap:
        name: golden-image-catalog
    - name: admin-scripts
      configMap:
        name: admin-scripts
        defaultMode: 0555

  templates:
    - name: main
      dag:
        tasks:
          - name: prepare-build-context
            template: prepare-build-context
            arguments:
              parameters:
                - name: image-type
                  value: "{{workflow.parameters.image-type}}"
                - name: user-id
                  value: "{{workflow.parameters.user-id}}"
                - name: repository-url
                  value: "{{workflow.parameters.bitbucket-address-user-code}}"
                - name: git-revision
                  value: "{{workflow.parameters.git-revision}}"
                - name: context-path
                  value: "{{workflow.parameters.context-path}}"
                - name: requirements-lock-path
                  value: "{{workflow.parameters.requirements-lock-path}}"
                - name: golden-image-uuid
                  value: "{{workflow.parameters.golden-image-uuid}}"
                - name: image-name
                  value: "{{workflow.parameters.image-name}}"
                - name: shell-type
                  value: "{{workflow.parameters.shell-type}}"
                - name: entrypoint-type
                  value: "{{workflow.parameters.entrypoint-type}}"
                - name: entrypoint-value
                  value: "{{workflow.parameters.entrypoint-value}}"
                - name: entrypoint-args
                  value: "{{workflow.parameters.entrypoint-args}}"
                - name: working-directory
                  value: "{{workflow.parameters.working-directory}}"
                - name: run-as-user
                  value: "{{workflow.parameters.run-as-user}}"
                - name: environment-profile
                  value: "{{workflow.parameters.environment-profile}}"

          - name: build-and-push-image
            depends: prepare-build-context.Succeeded
            template: build-and-push-image
            arguments:
              parameters:
                - name: repository-name
                  value: "{{tasks.prepare-build-context.outputs.parameters.repository-name}}"
                - name: image-name
                  value: "{{workflow.parameters.image-name}}"
                - name: buildkit-address
                  value: "{{workflow.parameters.buildkit-address}}"
                - name: registry-address
                  value: "{{workflow.parameters.registry-address}}"
                - name: registry-project
                  value: "{{workflow.parameters.registry-project}}"
                - name: cache-registry-address
                  value: "{{workflow.parameters.cache-registry-address}}"
                - name: image-tag
                  value: "{{workflow.parameters.image-tag}}"
                - name: nexus-pypi-url
                  value: "{{workflow.parameters.nexus-pypi-url}}"

          - name: write-result
            depends: build-and-push-image.Succeeded
            template: write-result
            arguments:
              parameters:
                - name: image-type
                  value: "{{workflow.parameters.image-type}}"
                - name: user-id
                  value: "{{workflow.parameters.user-id}}"
                - name: repository-name
                  value: "{{tasks.prepare-build-context.outputs.parameters.repository-name}}"
                - name: git-revision
                  value: "{{workflow.parameters.git-revision}}"
                - name: context-path
                  value: "{{workflow.parameters.context-path}}"
                - name: requirements-lock-path
                  value: "{{workflow.parameters.requirements-lock-path}}"
                - name: accelerator
                  value: "{{tasks.prepare-build-context.outputs.parameters.accelerator}}"
                - name: architecture
                  value: "{{tasks.prepare-build-context.outputs.parameters.architecture}}"
                - name: gpu-model
                  value: "{{tasks.prepare-build-context.outputs.parameters.gpu-model}}"
                - name: gpu-architecture
                  value: "{{tasks.prepare-build-context.outputs.parameters.gpu-architecture}}"
                - name: cuda-version
                  value: "{{tasks.prepare-build-context.outputs.parameters.cuda-version}}"
                - name: minimum-driver-version
                  value: "{{tasks.prepare-build-context.outputs.parameters.minimum-driver-version}}"
                - name: runtime-image
                  value: "{{tasks.prepare-build-context.outputs.parameters.runtime-image}}"
                - name: lock-hash
                  value: "{{tasks.prepare-build-context.outputs.parameters.lock-hash}}"
                - name: image-reference
                  value: "{{tasks.build-and-push-image.outputs.parameters.image-reference}}"
                - name: image-digest
                  value: "{{tasks.build-and-push-image.outputs.parameters.image-digest}}"

          - name: notify-result
            depends: write-result.Succeeded
            template: notify-result
            arguments:
              parameters:
                - name: notification-server-url
                  value: "{{workflow.parameters.notification-server-url}}"

    - name: prepare-build-context
      inputs:
        parameters:
          - name: image-type
          - name: user-id
          - name: repository-url
          - name: git-revision
          - name: context-path
          - name: requirements-lock-path
          - name: golden-image-uuid
          - name: image-name
          - name: shell-type
          - name: entrypoint-type
          - name: entrypoint-value
          - name: entrypoint-args
          - name: working-directory
          - name: run-as-user
          - name: environment-profile
      outputs:
        parameters:
          - name: repository-name
            valueFrom:
              path: /tmp/repository-name.txt
          - name: runtime-image
            valueFrom:
              path: /tmp/runtime-image.txt
          - name: parent-image-digest
            valueFrom:
              path: /tmp/parent-image-digest.txt
          - name: architecture
            valueFrom:
              path: /tmp/architecture.txt
          - name: accelerator
            valueFrom:
              path: /tmp/accelerator.txt
          - name: gpu-model
            valueFrom:
              path: /tmp/gpu-model.txt
          - name: gpu-architecture
            valueFrom:
              path: /tmp/gpu-architecture.txt
          - name: cuda-version
            valueFrom:
              path: /tmp/cuda-version.txt
          - name: minimum-driver-version
            valueFrom:
              path: /tmp/minimum-driver-version.txt
          - name: nvidia-driver-capabilities
            valueFrom:
              path: /tmp/nvidia-driver-capabilities.txt
          - name: lock-hash
            valueFrom:
              path: /tmp/lock-hash.txt
      script:
        image: harbor.CHANGE_ME.internal/platform/build-tools:1.0.0@sha256:CHANGE_ME
        command: [sh]
        source: |
          set -euo pipefail

          export REPOSITORY_URL="{{inputs.parameters.repository-url}}"
          export IMAGE_TYPE="{{inputs.parameters.image-type}}"
          export USER_ID="{{inputs.parameters.user-id}}"
          export GIT_REVISION="{{inputs.parameters.git-revision}}"
          export CONTEXT_PATH="{{inputs.parameters.context-path}}"
          export REQUIREMENTS_LOCK_PATH="{{inputs.parameters.requirements-lock-path}}"
          export IMAGE_NAME="{{inputs.parameters.image-name}}"
          export SHELL_TYPE="{{inputs.parameters.shell-type}}"
          export ENTRYPOINT_TYPE="{{inputs.parameters.entrypoint-type}}"
          export ENTRYPOINT_VALUE="{{inputs.parameters.entrypoint-value}}"
          export ENTRYPOINT_ARGS="{{inputs.parameters.entrypoint-args}}"
          export WORKING_DIRECTORY="{{inputs.parameters.working-directory}}"
          export RUN_AS_USER="{{inputs.parameters.run-as-user}}"
          export ENVIRONMENT_PROFILE="{{inputs.parameters.environment-profile}}"
          python /opt/admin/scripts/validate_input.py

          export GOLDEN_IMAGE_UUID="{{inputs.parameters.golden-image-uuid}}"
          export CATALOG_PATH=/catalog/golden-image-catalog.json
          python /opt/admin/scripts/resolve_golden_image.py

          export WORKSPACE_DIR=/workspace
          sh /opt/admin/scripts/fetch_source.sh

          export RUNTIME_IMAGE="$(cat /tmp/runtime-image.txt)"
          export ACCELERATOR="$(cat /tmp/accelerator.txt)"
          export ARCHITECTURE="$(cat /tmp/architecture.txt)"
          export GPU_MODEL="$(cat /tmp/gpu-model.txt)"
          export GPU_ARCHITECTURE="$(cat /tmp/gpu-architecture.txt)"
          export CUDA_VERSION="$(cat /tmp/cuda-version.txt)"
          export MINIMUM_DRIVER_VERSION="$(cat /tmp/minimum-driver-version.txt)"
          export NVIDIA_DRIVER_CAPABILITIES="$(cat /tmp/nvidia-driver-capabilities.txt)"
          sh /opt/admin/scripts/create_6_layer_dockerfile.sh
        volumeMounts:
          - name: admin-scripts
            mountPath: /opt/admin/scripts
            readOnly: true
          - name: workspace
            mountPath: /workspace
          - name: bitbucket-ssh
            mountPath: /root/.ssh
            readOnly: true
          - name: golden-image-catalog
            mountPath: /catalog
            readOnly: true

    - name: build-and-push-image
      inputs:
        parameters:
          - name: repository-name
          - name: image-name
          - name: buildkit-address
          - name: registry-address
          - name: registry-project
          - name: cache-registry-address
          - name: image-tag
          - name: nexus-pypi-url
      outputs:
        parameters:
          - name: image-reference
            valueFrom:
              path: /tmp/image-reference.txt
          - name: image-digest
            valueFrom:
              path: /tmp/image-digest.txt
      script:
        image: harbor.CHANGE_ME.internal/platform/buildkit-client-tools:1.0.0@sha256:CHANGE_ME
        command: [sh]
        source: |
          set -euo pipefail

          export REPOSITORY_NAME="{{inputs.parameters.repository-name}}"
          export IMAGE_NAME="{{inputs.parameters.image-name}}"
          export BUILDKIT_ADDRESS="{{inputs.parameters.buildkit-address}}"
          export REGISTRY_ADDRESS="{{inputs.parameters.registry-address}}"
          export REGISTRY_PROJECT="{{inputs.parameters.registry-project}}"
          export CACHE_REGISTRY_ADDRESS="{{inputs.parameters.cache-registry-address}}"
          export IMAGE_TAG="{{inputs.parameters.image-tag}}"
          export NEXUS_PYPI_URL="{{inputs.parameters.nexus-pypi-url}}"
          export WORKSPACE_DIR=/workspace
          sh /opt/admin/scripts/build_and_push_image.sh
        volumeMounts:
          - name: admin-scripts
            mountPath: /opt/admin/scripts
            readOnly: true
          - name: workspace
            mountPath: /workspace
          - name: registry-auth
            mountPath: /root/.docker
            readOnly: true
      retryStrategy:
        limit: "2"
        retryPolicy: OnError
        backoff:
          duration: 10s
          factor: 2
          maxDuration: 2m

    - name: write-result
      inputs:
        parameters:
          - name: image-type
          - name: user-id
          - name: repository-name
          - name: git-revision
          - name: context-path
          - name: requirements-lock-path
          - name: accelerator
          - name: architecture
          - name: gpu-model
          - name: gpu-architecture
          - name: cuda-version
          - name: minimum-driver-version
          - name: runtime-image
          - name: lock-hash
          - name: image-reference
          - name: image-digest
      outputs:
        artifacts:
          - name: build-report
            path: /workspace/output/build-report.json
      script:
        image: alpine:3.22
        command: [sh]
        source: |
          set -euo pipefail

          export WORKFLOW_NAME="{{workflow.name}}"
          export WORKFLOW_UID="{{workflow.uid}}"
          export WORKFLOW_NAMESPACE="{{workflow.namespace}}"
          export IMAGE_TYPE="{{inputs.parameters.image-type}}"
          export USER_ID="{{inputs.parameters.user-id}}"
          export REPOSITORY_NAME="{{inputs.parameters.repository-name}}"
          export GIT_REVISION="{{inputs.parameters.git-revision}}"
          export CONTEXT_PATH="{{inputs.parameters.context-path}}"
          export REQUIREMENTS_LOCK_PATH="{{inputs.parameters.requirements-lock-path}}"
          export ACCELERATOR="{{inputs.parameters.accelerator}}"
          export ARCHITECTURE="{{inputs.parameters.architecture}}"
          export GPU_MODEL="{{inputs.parameters.gpu-model}}"
          export GPU_ARCHITECTURE="{{inputs.parameters.gpu-architecture}}"
          export CUDA_VERSION="{{inputs.parameters.cuda-version}}"
          export MINIMUM_DRIVER_VERSION="{{inputs.parameters.minimum-driver-version}}"
          export RUNTIME_IMAGE="{{inputs.parameters.runtime-image}}"
          export LOCK_HASH="{{inputs.parameters.lock-hash}}"
          export IMAGE_REFERENCE="{{inputs.parameters.image-reference}}"
          export IMAGE_DIGEST="{{inputs.parameters.image-digest}}"
          export WORKSPACE_DIR=/workspace
          sh /opt/admin/scripts/write_result.sh
        volumeMounts:
          - name: admin-scripts
            mountPath: /opt/admin/scripts
            readOnly: true
          - name: workspace
            mountPath: /workspace

    - name: notify-result
      inputs:
        parameters:
          - name: notification-server-url
      script:
        image: harbor.CHANGE_ME.internal/platform/build-tools:1.0.0@sha256:CHANGE_ME
        command: [sh]
        source: |
          set -euo pipefail

          NOTIFICATION_SERVER_URL="{{inputs.parameters.notification-server-url}}"
          cat /workspace/output/build-report.json

          if [ -z "${NOTIFICATION_SERVER_URL}" ]; then
            echo "notification-server-url is empty. Skip notification."
            exit 0
          fi

          curl -sS --fail \
            --retry 3 \
            --retry-delay 2 \
            -H "Content-Type: application/json" \
            --data-binary @/workspace/output/build-report.json \
            "${NOTIFICATION_SERVER_URL}"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
