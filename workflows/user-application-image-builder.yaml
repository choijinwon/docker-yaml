apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: user-application-image-builder
spec:
  entrypoint: build-application-image
  serviceAccountName: argo-workflow
  arguments:
    parameters:
      - name: golden_image_uuid
      - name: git_url
      - name: git_revision
        value: main
      - name: context_path
        value: "."
      - name: requirements_lock_path
        value: requirements.lock
      - name: entrypoint
        value: "python app.py"
      - name: output_repository
      - name: output_tag
  templates:
    - name: build-application-image
      steps:
        - - name: resolve-golden-image
            template: resolve-golden-image
        - - name: clone-source
            template: clone-source
        - - name: validate-requirements
            template: validate-requirements
        - - name: build-image
            template: build-image
            arguments:
              parameters:
                - name: golden_image
                  value: "{{steps.resolve-golden-image.outputs.parameters.golden_image}}"

    - name: resolve-golden-image
      script:
        image: harbor.local/platform/python:3.11
        command: [python]
        source: |
          import json

          uuid = "{{workflow.parameters.golden_image_uuid}}"
          catalog_path = "/catalog/golden-image-catalog.json"

          with open(catalog_path, encoding="utf-8") as f:
              catalog = json.load(f)

          matches = [item for item in catalog if item["uuid"] == uuid]
          if not matches:
              raise SystemExit(f"golden image uuid not found: {uuid}")

          record = matches[0]
          if record["status"] != "active":
              raise SystemExit(f"golden image is not active: {uuid}")

          image = record["image"]
          pathlib_path = "/tmp/golden_image"
          with open(pathlib_path, "w", encoding="utf-8") as f:
              f.write(f'{image["repository"]}@{image["digest"]}')
        volumeMounts:
          - name: golden-image-catalog
            mountPath: /catalog
      outputs:
        parameters:
          - name: golden_image
            valueFrom:
              path: /tmp/golden_image

    - name: clone-source
      container:
        image: harbor.local/platform/git:latest
        command: [sh, -c]
        args:
          - |
            git clone --depth 1 --branch "{{workflow.parameters.git_revision}}" "{{workflow.parameters.git_url}}" /workspace/source
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    - name: validate-requirements
      script:
        image: harbor.local/platform/python:3.11
        command: [python]
        source: |
          import pathlib
          import re

          base = pathlib.Path("/workspace/source") / "{{workflow.parameters.context_path}}"
          lock = base / "{{workflow.parameters.requirements_lock_path}}"
          if not lock.exists():
              raise SystemExit(f"requirements.lock not found: {lock}")

          invalid = []
          pattern = re.compile(r"^[A-Za-z0-9_.-]+==[^=<>!~ ]+$")
          for line in lock.read_text(encoding="utf-8").splitlines():
              stripped = line.strip()
              if not stripped or stripped.startswith("#"):
                  continue
              if not pattern.match(stripped):
                  invalid.append(stripped)

          if invalid:
              raise SystemExit("requirements.lock must pin exact versions: " + ", ".join(invalid))
        volumeMounts:
          - name: workspace
            mountPath: /workspace

    - name: build-image
      inputs:
        parameters:
          - name: golden_image
      script:
        image: harbor.local/platform/kaniko-wrapper:latest
        command: [sh]
        source: |
          set -eu
          cd /workspace/source/{{workflow.parameters.context_path}}

          cat > Dockerfile.generated <<EOF
          FROM {{inputs.parameters.golden_image}}
          WORKDIR /app
          COPY . /app
          RUN python -m pip install --no-index --find-links=/opt/wheelhouse --requirement {{workflow.parameters.requirements_lock_path}}
          CMD {{workflow.parameters.entrypoint}}
          EOF

          /kaniko/executor \
            --dockerfile=Dockerfile.generated \
            --context=dir://$(pwd) \
            --destination={{workflow.parameters.output_repository}}:{{workflow.parameters.output_tag}}
        volumeMounts:
          - name: workspace
            mountPath: /workspace

  volumes:
    - name: workspace
      emptyDir: {}
    - name: golden-image-catalog
      configMap:
        name: golden-image-catalog
